<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F9A68"/>
      <stop offset="1" stop-color="#16603F"/>
    </linearGradient>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3EF"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sombraPapel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B3D27" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Losa con la proporción de macOS (824 px dentro de 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fondo)" filter="url(#sombra)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- Comprobante con borde inferior dentado -->
  <path filter="url(#sombraPapel)" fill="url(#papel)"
        d="M322 226 h380 a26 26 0 0 1 26 26 V758
           l-42 34 -42 -34 -42 34 -42 -34 -42 34 -42 -34 -42 34 -42 -34 -42 34 -42 -34 -26 21
           V252 a26 26 0 0 1 26 -26 z"/>
  <!-- Renglones -->
  <g fill="#C9D8CE">
    <rect x="372" y="300" width="200" height="30" rx="15"/>
    <rect x="372" y="370" width="280" height="30" rx="15"/>
    <rect x="372" y="440" width="230" height="30" rx="15"/>
  </g>
  <!-- Sello de validado -->
  <circle cx="650" cy="640" r="128" fill="#16603F"/>
  <circle cx="650" cy="640" r="128" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M592 642 l40 40 l82 -86" fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
