name: Compilar ejecutables

on:
  workflow_dispatch:       # botón "Run workflow" en la pestaña Actions (respaldo manual)
    inputs:
      forzar:
        description: "Compilar aunque el código no haya cambiado"
        type: boolean
        default: false
  push:
    branches: [main]       # se compila únicamente al mergear/empujar a main

permissions:
  contents: write          # necesario para crear/actualizar el Release y mover el tag

jobs:
  cambios:
    name: ¿Cambió el código?
    runs-on: ubuntu-latest
    outputs:
      construir: ${{ steps.detectar.outputs.construir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detectar
        env:
          FORZAR: ${{ inputs.forzar }}
          ANTERIOR: ${{ github.event.before }}
        run: |
          if [ "$FORZAR" = "true" ]; then
            echo "Compilación forzada por el usuario."
            echo "construir=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # En ejecución manual (workflow_dispatch) no hay commit anterior: se compila.
          if [ -z "$ANTERIOR" ] || [ "$ANTERIOR" = "0000000000000000000000000000000000000000" ]; then
            echo "Sin commit anterior de referencia; se compila."
            echo "construir=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$ANTERIOR" HEAD -- app launcher.py assets requirements.txt comprobantes_sri.spec .github/workflows/build.yml; then
            echo "Sin cambios en el código desde $ANTERIOR; se omite la compilación."
            echo "construir=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cambios detectados desde $ANTERIOR; se compila."
            echo "construir=true" >> "$GITHUB_OUTPUT"
          fi

  pruebas:
    name: Pruebas unitarias
    needs: cambios
    if: needs.cambios.outputs.construir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  compilar:
    # Solo Linux y Windows: son las plataformas que se pueden distribuir sin
    # certificado de firma/notarización de Apple.
    name: Ejecutable (${{ matrix.nombre }})
    needs: pruebas
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: ubuntu-22.04        # glibc antigua = el binario corre también en distros nuevas
            nombre: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tkinter necesita las librerías Tcl/Tk del sistema para que PyInstaller
      # las recolecte; el runner de Ubuntu no las trae por defecto.
      - name: Dependencias del sistema (Linux)
        if: matrix.nombre == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller comprobantes_sri.spec --noconfirm --clean

      # Comprobación de humo: el binario debe arrancar y responder --selftest.
      # No falla el job (el runner no tiene Chrome), solo deja rastro en el log.
      - name: Verificar que el binario arranca (Linux)
        if: matrix.nombre == 'linux'
        continue-on-error: true
        run: |
          ./dist/ComprobantesSRI/ComprobantesSRI --selftest || true
          cat "${TMPDIR:-/tmp}/sri_selftest.log" 2>/dev/null || true

      # Se comprime la CARPETA, no su contenido: con "dist/ComprobantesSRI/*"
      # el zip queda plano y al extraerlo vuelca ~1200 archivos sueltos.
      - name: Empaquetar (Windows)
        if: matrix.nombre == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/ComprobantesSRI" -DestinationPath "dist/ComprobantesSRI-windows.zip" -Force

      # En Linux se usa tar.gz: zip no conserva el bit de ejecución del binario.
      - name: Empaquetar (Linux)
        if: matrix.nombre == 'linux'
        run: tar -czf dist/ComprobantesSRI-linux.tar.gz -C dist ComprobantesSRI

      - uses: actions/upload-artifact@v4
        with:
          name: ComprobantesSRI-${{ matrix.nombre }}
          path: |
            dist/ComprobantesSRI-windows.zip
            dist/ComprobantesSRI-linux.tar.gz
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publicar Release "latest"
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mover el tag "latest" al commit actual
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: binarios
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última compilación (main)"
          body: |
            Ejecutables generados automáticamente desde el último merge a main.
            Este Release se actualiza en cada merge.

            - `ComprobantesSRI-windows.zip` — descomprima la carpeta completa y ejecute `ComprobantesSRI.exe`.
            - `ComprobantesSRI-linux.tar.gz` — `tar -xzf` y ejecute `ComprobantesSRI/ComprobantesSRI`.

            Requisito en la máquina destino: tener Google Chrome instalado (pestaña Descarga).
          prerelease: true
          files: |
            binarios/ComprobantesSRI-windows.zip
            binarios/ComprobantesSRI-linux.tar.gz
