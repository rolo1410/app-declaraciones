name: Compilar ejecutables

on:
  workflow_dispatch:       # botón "Run workflow" en la pestaña Actions
    inputs:
      forzar:
        description: "Compilar aunque el código no haya cambiado"
        type: boolean
        default: false
  push:
    tags: ["v*"]           # también al publicar una etiqueta de versión (ej. v1.0.0)

permissions:
  contents: write          # necesario para crear Releases

jobs:
  cambios:
    name: ¿Cambió el código?
    runs-on: ubuntu-latest
    outputs:
      construir: ${{ steps.detectar.outputs.construir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detectar
        env:
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [ "$FORZAR" = "true" ]; then
            echo "Compilación forzada por el usuario."
            echo "construir=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          anterior=$(git tag --sort=-creatordate | grep '^v' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -z "$anterior" ]; then
            echo "No hay versión anterior; se compila."
            echo "construir=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$anterior" HEAD -- app launcher.py assets requirements.txt comprobantes_sri.spec .github/workflows/build.yml; then
            echo "Sin cambios en el código desde $anterior; se omite la compilación."
            echo "construir=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cambios detectados desde $anterior; se compila."
            echo "construir=true" >> "$GITHUB_OUTPUT"
          fi

  pruebas:
    name: Pruebas unitarias
    needs: cambios
    if: needs.cambios.outputs.construir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  compilar:
    name: Ejecutable (${{ matrix.nombre }})
    needs: pruebas
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller comprobantes_sri.spec --noconfirm --clean

      - name: Empaquetar (Windows)
        if: matrix.nombre == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/ComprobantesSRI/*" -DestinationPath "dist/ComprobantesSRI-windows.zip" -Force

      - name: Empaquetar (macOS)
        if: matrix.nombre == 'macOS'
        run: ditto -c -k --keepParent dist/ComprobantesSRI.app dist/ComprobantesSRI-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ComprobantesSRI-${{ matrix.nombre }}
          path: dist/ComprobantesSRI-${{ matrix.nombre }}.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publicar en Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: binarios
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binarios/ComprobantesSRI-windows.zip
            binarios/ComprobantesSRI-macOS.zip
